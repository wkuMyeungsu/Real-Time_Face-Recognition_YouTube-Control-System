# Mosquitto 2.0 설정 (broker 파트). 토픽·메시지 형식은 docs/contracts/README.md.

# 1883: face-detector(ESP32)·playback-decider가 쓰는 MQTT.
#       ESP32가 Wi-Fi로 들어오므로 호스트에 열려 있다 (docker-compose.yml, Windows 방화벽 1883 허용).
listener 1883
protocol mqtt

# 9001: 브라우저(player)가 쓰는 MQTT over WebSocket.
#       호스트에 열지 않는다. player(nginx)의 /mqtt가 broker:9001로 넘겨준다.
listener 9001
protocol websockets

# 같은 Wi-Fi 안에서 쓰는 데모라 계정 없이 받는다.
# 공용 Wi-Fi에서 시연할 때는 password_file을 켠다 (services/broker/README.md "계정 켜기").
allow_anonymous true

# retain 메시지(status)를 디스크에 남기지 않는다. broker를 다시 켜면 비워지고,
# face-detector가 다시 접속하며 status를 새로 보낸다.
persistence false

# face는 초당 최대 10개의 작은 메시지다. 묶어 보내느라 생기는 지연(Nagle)을 끈다.
set_tcp_nodelay true

# docker compose logs broker 로 접속·끊김을 본다 (보드가 붙었는지, LWT가 나갔는지 확인할 때).
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%d %H:%M:%S
