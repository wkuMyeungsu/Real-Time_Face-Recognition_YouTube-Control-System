name: ci
on: [pull_request, push]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d --wait  # healthcheck 통과까지 기다린다
      - name: tests/ 가 있는 서비스만 pytest
        run: |
          for d in services/*/; do
            s=$(basename "$d")
            if [ -d "$d/tests" ]; then docker compose run --rm --no-deps "$s" pytest -q; fi
          done
      - if: failure()
        run: docker compose logs

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp firmware/zero_touch/secrets.example.h firmware/zero_touch/secrets.h
      - uses: arduino/compile-sketches@v1  # 컴파일까지만. 업로드는 각자 PC에서
        with:
          fqbn: esp32:esp32:XIAO_ESP32S3
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12
          libraries: |
            - name: PubSubClient
              version: 2.8
            - name: ArduinoJson
              version: 7.2.1
          sketch-paths: |
            - firmware/zero_touch
