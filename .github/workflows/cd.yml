# CD (Continuous Delivery): CI 초록불을 받은 결과물을 누구나 같은 것으로 받게 내보낸다. 실행은 사람이 한다 (docs/ci-cd.md).
#   main 병합 → playback-decider·player·recorder 이미지 빌드 (tag = 커밋 SHA, main) → ghcr.io push → 데모 PC에서 pull · up -d
#   v* 태그   → face-detector 펌웨어 컴파일 (README 환경 표 그대로) → GitHub Release에 .bin 첨부 → 보드 업로드는 각자 PC
# main에는 브랜치 보호 규칙 때문에 CI를 통과한 커밋만 들어온다. 그래서 main push 자체가 CD의 신호다.
# broker는 공식 이미지(eclipse-mosquitto)와 저장소의 mosquitto.conf로 뜨므로 따로 올리지 않는다.
name: cd

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write    # Release 만들기
  packages: write    # ghcr.io에 push

jobs:
  images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04   # CI와 같은 러너 (ubuntu-latest는 Ubuntu 26으로 옮겨 가는 중)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 빌드·push (커밋 SHA와 main 두 태그)
        run: |
          export REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          for TAG in "$GITHUB_SHA" main; do
            export TAG
            docker compose build playback-decider player recorder
            docker compose push playback-decider player recorder
          done
          {
            echo "### 이미지 (${GITHUB_SHA::7})"
            echo
            echo "데모 PC: \`TAG=$GITHUB_SHA docker compose pull && TAG=$GITHUB_SHA docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"

  firmware:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # README "개발 환경" 표와 같은 값 (tests/test_contracts.py가 확인)
      FQBN: esp32:esp32:XIAO_ESP32S3:PSRAM=opi
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: 코어·라이브러리 설치
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$ESP32_INDEX"
          arduino-cli lib install PubSubClient@2.8 ArduinoJson@7.2.1
      - name: 모델 라이브러리 설치 (CI와 같은 단계. fw 0.3.0부터 face_runner.cpp가 모델 라이브러리를 쓴다)
        run: |
          mkdir -p ~/Arduino/libraries
          for z in device/face-model/*.zip; do
            [ -e "$z" ] || { echo "모델 zip 없음"; break; }
            unzip -q -o "$z" -d ~/Arduino/libraries
          done
      - run: cp device/face-detector/secrets.example.h device/face-detector/secrets.h
      - name: 컴파일
        run: arduino-cli compile --fqbn "$FQBN" --output-dir build device/face-detector
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*.bin
          generate_release_notes: true
          body: |
            face-detector 펌웨어 (FQBN `esp32:esp32:XIAO_ESP32S3:PSRAM=opi`, esp32 코어 3.3.12).
            Wi-Fi·broker 주소는 예시 값(secrets.example.h)으로 컴파일됐다. 각자 보드에는 secrets.h를 채워 직접 올린다.
