# 기능 목록. 테스트는 @pytest.mark.feature("<번호>")로 여기의 기능에 묶인다 (docs/ci-cd.md).
#
# status = "todo"  아직 만들지 않은 기능. 테스트가 실패해도 CI는 통과한다.
#                  테스트가 통과하면 CI가 실패한다 → 구현한 PR에서 "done"으로 바꾸라는 뜻.
# status = "done"  만든 기능. 테스트가 반드시 통과해야 병합할 수 있다.
#                  한 번 "done"이 된 기능은 "todo"로 돌리거나 지울 수 없다 (CI가 막음). 기능이 쌓일수록 깨지지 않는다.
#
# 기준 문서: docs/contracts/README.md (토픽·형식), README.md (실행·환경), .env.example (판정 기준)

